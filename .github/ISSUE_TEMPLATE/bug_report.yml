name: Connector bug
description: Report a reproducible parser, mapping, polling, or ingestion problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data only. Do not include tokens, company UUIDs, personal data, real alert payloads, or proprietary SDK files. Report vulnerabilities privately using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Connector version or commit
      placeholder: "0.4.0 or a commit SHA"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Python and Anomali Feed SDK versions
      placeholder: "Python 3.11 / Feed SDK 2.8.1"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the service slug and sanitized error category, without tenant values.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Steps and a synthetic response with the same field structure.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Relevant configuration and verification
      description: Non-secret limits, schedule, and whether this occurs offline or in a vendor tenant.
  - type: checkboxes
    id: safe_evidence
    attributes:
      label: Evidence review
      options:
        - label: This report contains no secrets, personal data, live tenant payloads, or proprietary SDK files.
          required: true
